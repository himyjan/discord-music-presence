name: Slint Preview Release

on:
  push:
    tags:
      - "slint-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS ARM64
            executable: ""
            asset: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS x86-64
            executable: ""
            asset: macos-x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: Windows x86-64
            executable: ".exe"
            asset: windows-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86-64
            executable: ""
            asset: linux-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> app/target

      - name: Build release binary
        working-directory: app
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release archive
        shell: bash
        env:
          ASSET: music-presence-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          else
            runner_temp="$RUNNER_TEMP"
          fi
          package_root="$runner_temp/package"
          package_dir="$package_root/music-presence"
          mkdir -p "$package_dir"
          cp "app/target/$TARGET/release/music-presence$EXECUTABLE" \
            "$package_dir/music-presence$EXECUTABLE"
          cp app/README.md "$package_dir/README.md"
          tar -czf "$runner_temp/$ASSET" -C "$package_root" music-presence

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: ${{ runner.temp }}/music-presence-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish preview release
    if: startsWith(github.ref, 'refs/tags/slint-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Music Presence Slint Preview ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
