[package]
name = "music-presence"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rust and Slint desktop UI scaffold for Music Presence"

[dependencies]
aes-gcm = "0.11"
base64 = "0.22"
discord-rich-presence = "1.1"
getrandom = "0.4.3"
keyring = "4.2"
md-5 = "0.10"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18"] }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "sync"] }
twilight-gateway = { version = "0.18", default-features = false, features = ["rustls-native-roots"] }
twilight-model = "0.18"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
webbrowser = "1"
zeroize = "1"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
